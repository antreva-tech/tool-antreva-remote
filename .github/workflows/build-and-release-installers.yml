name: Build Installer Test Artifacts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antreva-desk-test-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build non-installing test artifact
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Build pilot installer bundle
        shell: pwsh
        run: ./scripts/Build-PilotBundle.ps1

      - name: Verify x64 Command Prompt bundle without installing
        shell: cmd
        run: artifacts\Antreva-Desk-1.0.4-Windows\Antreva-Remote-Pilot-Setup.cmd --verify-bundle

      - name: Verify simulated x86 Command Prompt bundle without installing
        shell: cmd
        run: |
          set PROCESSOR_ARCHITECTURE=x86
          set PROCESSOR_ARCHITEW6432=
          artifacts\Antreva-Desk-1.0.4-Windows\Antreva-Remote-Pilot-Setup.cmd --verify-bundle

      - name: Upload 30-day test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antreva-Desk-1.0.4-Windows
          path: |
            artifacts/Antreva-Desk-1.0.4-Windows.zip
            artifacts/Antreva-Desk-1.0.4-Windows.sha256.txt
          if-no-files-found: error
          retention-days: 30
