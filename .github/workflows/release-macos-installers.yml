name: Release Mac Installers

on:
  workflow_dispatch:
    inputs:
      certification_evidence_url:
        description: HTTPS archive of live Intel and Apple Silicon Mac certification results
        required: true
        type: string
      certification_evidence_sha256:
        description: SHA-256 of the Mac certification archive
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: antreva-desk-macos-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    environment: macos-release
    env:
      RELEASE_TAG: antreva-desk-macos-1.0.6
      MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      EVIDENCE_URL: ${{ inputs.certification_evidence_url }}
      EVIDENCE_SHA256: ${{ inputs.certification_evidence_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release from main only.'; exit 1; }
          for name in MACOS_INSTALLER_CERTIFICATE_BASE64 MACOS_INSTALLER_CERTIFICATE_PASSWORD MACOS_INSTALLER_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing protected secret: $name"; exit 1; }
          done
          [[ "$MACOS_INSTALLER_IDENTITY" == 'Developer ID Installer: '* ]] || exit 1
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || exit 1
          [[ "$EVIDENCE_URL" == https://* && "$EVIDENCE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || exit 1
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo 'Release tag already exists; tags are immutable.'; exit 1
          fi
      - name: Test and build both packages
        run: |
          python3 -m unittest discover -s tests -p 'test_macos*.py' -v
          python3 scripts/build-macos-installers.py --arch x86_64
          python3 scripts/build-macos-installers.py --arch arm64
      - name: Verify certification evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' "$EVIDENCE_URL" -o artifacts/macos/Mac-Certification.zip
          actual=$(shasum -a 256 artifacts/macos/Mac-Certification.zip | cut -d ' ' -f1)
          [[ "$actual" == "$(printf '%s' "$EVIDENCE_SHA256" | tr '[:upper:]' '[:lower:]')" ]]
      - name: Sign, notarize and staple installers
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/antreva-macos.keychain-db"
          certificate="$RUNNER_TEMP/antreva-installer.p12"
          keychain_password=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$keychain_password"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$certificate"' EXIT
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          for package in artifacts/macos/*.pkg; do
            productsign --keychain "$keychain" --sign "$MACOS_INSTALLER_IDENTITY" "$package" "$RUNNER_TEMP/signed.pkg"
            mv "$RUNNER_TEMP/signed.pkg" "$package"
            signature=$(pkgutil --check-signature "$package")
            printf '%s\n' "$signature"
            printf '%s\n' "$signature" | grep -F "$MACOS_INSTALLER_IDENTITY"
            printf '%s\n' "$signature" | grep -F "($APPLE_TEAM_ID)"
            xcrun notarytool submit "$package" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 20m
            xcrun stapler staple "$package"
            xcrun stapler validate "$package"
            spctl --assess --type install --verbose=2 "$package"
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for package in Path('artifacts/macos').glob('*.pkg'):
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              package.with_suffix('.sha256.txt').write_text(f'{digest}  {package.name}\n')
              provenance = package.with_suffix('.provenance.json')
              data = json.loads(provenance.read_text())
              data.update(packageSha256=digest, installerSigned=True, notarized=True,
                          status='signed and notarized; live certification evidence attached')
              provenance.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Publish immutable Mac release
        shell: bash
        run: |
          cp docs/operations/MACOS-SUPPORT.md artifacts/macos/MACOS-SUPPORT.md
          gh release create "$RELEASE_TAG" artifacts/macos/* \
            --target "$GITHUB_SHA" --title 'Antreva Desk 1.0.6 for Mac' \
            --notes-file docs/operations/MACOS-SUPPORT.md --latest=false
